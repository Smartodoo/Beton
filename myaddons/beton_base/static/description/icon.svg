<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <rect width="128" height="128" rx="20" fill="#2c3e50"/>

  <!-- Concrete plant / factory silhouette -->
  <!-- Main building -->
  <rect x="25" y="55" width="35" height="45" rx="2" fill="#ecf0f1"/>
  <!-- Tall silo -->
  <rect x="65" y="30" width="20" height="70" rx="3" fill="#bdc3c7"/>
  <!-- Silo top dome -->
  <ellipse cx="75" cy="30" rx="12" ry="6" fill="#95a5a6"/>

  <!-- Small silo -->
  <rect x="88" y="45" width="15" height="55" rx="2" fill="#bdc3c7"/>
  <ellipse cx="95.5" cy="45" rx="9" ry="4" fill="#95a5a6"/>

  <!-- Conveyor belt (diagonal line) -->
  <line x1="42" y1="55" x2="68" y2="35" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>

  <!-- Windows on main building -->
  <rect x="30" y="62" width="8" height="8" rx="1" fill="#3498db" opacity="0.8"/>
  <rect x="42" y="62" width="8" height="8" rx="1" fill="#3498db" opacity="0.8"/>
  <rect x="30" y="76" width="8" height="8" rx="1" fill="#3498db" opacity="0.8"/>
  <rect x="42" y="76" width="8" height="8" rx="1" fill="#3498db" opacity="0.8"/>

  <!-- Door -->
  <rect x="35" y="88" width="12" height="12" rx="1" fill="#2c3e50"/>

  <!-- Concrete mixer truck (small) -->
  <g transform="translate(15, 92)">
    <!-- Truck body -->
    <rect x="0" y="0" width="18" height="8" rx="1" fill="#e67e22"/>
    <!-- Mixer drum -->
    <ellipse cx="9" cy="2" rx="7" ry="5" fill="#d35400"/>
    <!-- Wheels -->
    <circle cx="4" cy="10" r="3" fill="#2c3e50"/>
    <circle cx="14" cy="10" r="3" fill="#2c3e50"/>
    <circle cx="4" cy="10" r="1.5" fill="#7f8c8d"/>
    <circle cx="14" cy="10" r="1.5" fill="#7f8c8d"/>
  </g>

  <!-- Top label: "CB" text -->
  <text x="64" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c">CB</text>
</svg>
